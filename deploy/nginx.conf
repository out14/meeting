# web 컨테이너의 Nginx 설정 (client/Dockerfile 에서 사용)
# - /      : 빌드된 화면 파일. 새로고침해도 화면이 뜨도록 없는 경로는 index.html 로
# - /api/  : server 컨테이너 (docker compose 서비스 이름 server, 포트 4000)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 서버 버전 숨기기
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 실제 사용자 IP 전달 (server 의 TRUST_PROXY=1 과 짝)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # 빌드 파일은 이름에 해시가 붙어 있어 오래 캐시해도 된다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # index.html 은 매번 새로 받아 새 배포가 바로 반영되게
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
